[project]
name = "nutribot"
version = "2.0.0"
description = "AI Nutrition Coach — LangChain Agent + RAG + FastAPI"
requires-python = ">=3.11,<3.13"

dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.12",

    # LangChain stack
    "langchain==0.3.25",
    "langchain-anthropic>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-community==0.3.24",
    "langchain-chroma==0.2.4",
    "langgraph>=0.2.0",
    "chromadb>=1.0.9",

    # Local embeddings (no API key needed). Capped <4 — newer sentence-transformers
    # pulls transformers>=4.50, which requires torch>=2.4 (no Intel-Mac wheels).
    "sentence-transformers>=3.0.0,<4.0.0",

    # PostgreSQL
    "psycopg[binary]>=3.3.0",

    # Auth & security
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "email-validator==2.2.0",

    # Content moderation
    "mistralai>=1.0.0",

    # Config & utilities
    "pydantic-settings>=2.3.0",
    "python-dotenv==1.1.0",
    "requests>=2.32.0",
    "loguru>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
# Tell uv which target environments to resolve for.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# Require wheels for the platforms we actually need to support.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# Pin onnxruntime to a version that has Mac Intel wheels.
# Pin numpy <2 — torch 2.2.2 was built against the NumPy 1.x ABI.
constraint-dependencies = [
    "onnxruntime>=1.18.0,<1.20.0",
    "numpy<2",
]
